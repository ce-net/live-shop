name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix web --no-audit --no-fund
      # tsc --noEmit against sdk/ts/shop_gateway.ts, then the bundle
      - run: npm run build --prefix web
      - name: assemble the read-only page (the contract runs in the browser; nothing is called)
        run: |
          mkdir -p _site/dist
          cp web/index.html web/tokens.css web/style.css _site/
          cp -r web/img web/fonts _site/
          cp web/dist/app.js _site/dist/
          echo '{ "mode": "sim" }' > _site/config.json
          if [ -d proof ]; then cp -r proof _site/proof; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
