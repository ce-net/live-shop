# cell shop.cart: one cell, one crate; callers depend only on its contract crate
[cell]
api = "shop.cart"
crate = "shop-cart"
kind = "cell"
owner = "Leif Rydenfalk"
contract = "shop-cart-api"
replicas = 1
depends_on = ["shop.keys@1", "shop.catalog@1"]

[rights]
holds = "shop.catalog:price"
serves = "shop.cart:own, shop.cart:checkout"

[limits]
disk_bytes = 536870912
