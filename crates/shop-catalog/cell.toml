# cell shop.catalog: one cell, one crate; callers depend only on its contract crate
[cell]
api = "shop.catalog"
crate = "shop-catalog"
kind = "cell"
owner = "Leif Rydenfalk"
contract = "shop-catalog-api"
replicas = 1
depends_on = ["shop.keys@1"]

[rights]
holds = "none"
serves = "shop.catalog:read, :price, :write"

[limits]
disk_bytes = 268435456
