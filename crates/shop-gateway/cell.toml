# cell shop.gateway: one cell, one crate; callers depend only on its contract crate
[cell]
api = "shop.gateway"
crate = "shop-gateway"
kind = "cell"
owner = "Leif Rydenfalk"
contract = "shop-gateway-api"
replicas = 1
depends_on = ["shop.keys@1", "shop.catalog@1", "shop.cart@1", "shop.inventory@1", "shop.orders@1"]

[rights]
holds = "customer-facing rights, delegated per session and narrowed per checkout"
serves = "shop.gateway:public"

[limits]
disk_bytes = 67108864

[stamp]
id = "cell:shop.gateway"
kind = "cell"
path = "crates/shop-gateway/cell.toml"
updated_at = 2026-11-16T01:53:42Z
version = "0.1.0"
access = "public"
canonical_of = []
duplicate_of = ""
owner = "foreman/Leif Rydenfalk"
source_of_truth = "https://github.com/ce-net/live-shop"
stale_after = 180
