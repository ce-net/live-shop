# cell shop.pay: one cell, one crate; callers depend only on its contract crate
[cell]
api = "shop.pay"
crate = "shop-pay"
kind = "cell"
owner = "Leif Rydenfalk"
contract = "shop-pay-api"
replicas = 1
payments = "test mode only"
depends_on = ["shop.keys@1", "shop.pay.sim@1", "shop.orders@1"]

[rights]
holds = "shop.pay.sim:use; shop.orders:settle; shop.keys:secret/shop/pay/sim/webhook"
serves = "shop.pay:charge, :refund, :status, :webhook, :read"

[limits]
disk_bytes = 536870912

[stamp]
id = "cell:shop.pay"
kind = "cell"
path = "crates/shop-pay/cell.toml"
updated_at = 2026-11-16T01:53:42Z
version = "0.1.0"
access = "public"
canonical_of = []
duplicate_of = ""
owner = "foreman/Leif Rydenfalk"
source_of_truth = "https://github.com/ce-net/live-shop"
stale_after = 180
