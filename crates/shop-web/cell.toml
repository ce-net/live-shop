# cell shop.web: one cell, one crate; callers depend only on its contract crate
[cell]
api = "shop.web"
crate = "shop-web"
kind = "web"
owner = "Leif Rydenfalk"
replicas = 1
depends_on = ["shop.keys@1", "shop.gateway@1"]

[rights]
holds = "none"
serves = "http: the page and /rpc forwarded to shop.gateway"

[limits]
disk_bytes = 67108864
